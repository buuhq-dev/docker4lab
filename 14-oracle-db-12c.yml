# version: '3.8'
services:
  oracledb12c:
    image: oracle/database:12.2.1-ee
    container_name: oracledb12c
    environment:
      ORACLE_SID: ORCLCDB
      ORACLE_PDB: ORCLPDB1
      ORACLE_PWD: ${DB_PASSWORD}  # Change this to a strong password
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - ./oracledb12c:/opt/oracle/oradata  # Persistent storage for database files
    networks:
      - net-data
    ports:
      - "1521:1521"   # Oracle Listener Port
      - "5500:5500"   # Enterprise Manager Express
networks:
  net-data:
    name: net-data
    external: true
    driver: bridge